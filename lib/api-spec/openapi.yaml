openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Veer Mahadev Plastic B2B E-commerce API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Product catalog operations
  - name: categories
    description: Product category operations
  - name: enquiries
    description: B2B enquiry operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products with optional search and filtering
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search term for product name or SKU
        - name: category
          in: query
          schema:
            type: string
          description: Filter by category slug
        - name: limit
          in: query
          schema:
            type: integer
          description: Max number of results
        - name: offset
          in: query
          schema:
            type: integer
          description: Offset for pagination
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"

  /products/search-suggestions:
    get:
      operationId: getSearchSuggestions
      tags: [products]
      summary: Get auto-complete search suggestions
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Query string for suggestions
      responses:
        "200":
          description: Search suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchSuggestions"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all product categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"

  /products/stats:
    get:
      operationId: getProductStats
      tags: [products]
      summary: Get product catalog statistics
      responses:
        "200":
          description: Catalog stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductStats"

  /enquiries:
    post:
      operationId: submitEnquiry
      tags: [enquiries]
      summary: Submit a B2B order enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryInput"
      responses:
        "201":
          description: Enquiry submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enquiry"
        "400":
          description: Invalid enquiry data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Product:
      type: object
      required:
        - id
        - name
        - sku
        - category
        - categorySlug
        - packingQty
        - boxRate
        - pieceRate
        - imageUrl
        - inStock
      properties:
        id:
          type: integer
        name:
          type: string
        sku:
          type: string
        category:
          type: string
        categorySlug:
          type: string
        packingQty:
          type: integer
          description: Pieces per master carton
        boxRate:
          type: number
          description: Price per carton in INR
        pieceRate:
          type: number
          description: Retail price per piece in INR
        imageUrl:
          type: string
        inStock:
          type: boolean

    ProductList:
      type: object
      required:
        - products
        - total
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total:
          type: integer

    SearchSuggestions:
      type: object
      required:
        - suggestions
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/SearchSuggestion"

    SearchSuggestion:
      type: object
      required:
        - id
        - name
        - category
        - pieceRate
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        pieceRate:
          type: number

    Category:
      type: object
      required:
        - slug
        - name
        - productCount
      properties:
        slug:
          type: string
        name:
          type: string
        productCount:
          type: integer

    CategoryList:
      type: object
      required:
        - categories
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    ProductStats:
      type: object
      required:
        - totalProducts
        - totalCategories
        - categoryCounts
      properties:
        totalProducts:
          type: integer
        totalCategories:
          type: integer
        categoryCounts:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"

    CategoryCount:
      type: object
      required:
        - category
        - count
      properties:
        category:
          type: string
        count:
          type: integer

    CartItem:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: integer
        quantity:
          type: integer

    EnquiryInput:
      type: object
      required:
        - customerName
        - mobile
        - address
        - items
      properties:
        customerName:
          type: string
        mobile:
          type: string
        businessName:
          type: ["string", "null"]
        gstin:
          type: ["string", "null"]
        address:
          type: string
        district:
          type: ["string", "null"]
        pincode:
          type: ["string", "null"]
        currency:
          type: string
          default: INR
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        totalAmount:
          type: number
        notes:
          type: ["string", "null"]

    Enquiry:
      type: object
      required:
        - id
        - customerName
        - mobile
        - address
        - items
        - totalAmount
        - currency
        - createdAt
        - whatsappUrl
      properties:
        id:
          type: integer
        customerName:
          type: string
        mobile:
          type: string
        businessName:
          type: ["string", "null"]
        gstin:
          type: ["string", "null"]
        address:
          type: string
        district:
          type: ["string", "null"]
        pincode:
          type: ["string", "null"]
        currency:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        totalAmount:
          type: number
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        whatsappUrl:
          type: string

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string

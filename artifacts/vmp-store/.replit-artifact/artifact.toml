kind = "web"
previewPath = "/"
title = "Veer Mahadev Plastic Store"
version = "1.0.0"
id = "artifacts/vmp-store"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18133

[services.development]
run = "pnpm --filter @workspace/vmp-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vmp-store", "run", "build" ]
publicDir = "artifacts/vmp-store/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18133"
BASE_PATH = "/"
